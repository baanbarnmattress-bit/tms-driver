<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานส่งของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb;
    --primary:#06c755; --primary-dark:#04913f; --danger:#dc3c42; --blue:#2563eb;
    --late-bg:#fdecec; --today-bg:#e3f8ec; --date-bg:#eef2ff; --cod-bg:#fff3d6; --cod:#9a5b00; --note-bg:#fffbea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;color:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hello{font-size:13px;color:var(--muted)}
  .name{font-size:18px;font-weight:600}
  .icon-btn{border:0;background:#f1f3f5;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:500;color:var(--text)}
  .tabs{display:flex;margin-top:10px}
  .tab{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
  .tab.active{color:var(--text);border-color:var(--primary)}
  main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--date-bg);color:var(--blue);font-weight:500;white-space:nowrap}
  .badge.today{background:var(--today-bg);color:var(--primary-dark)}
  .badge.late{background:var(--late-bg);color:var(--danger)}
  .badge.cod{background:var(--cod-bg);color:var(--cod)}
  .jobid{font-size:12px;color:var(--muted)}
  .cust{font-size:17px;font-weight:600;margin:10px 0 2px}
  .addr{line-height:1.55;margin:4px 0}
  .meta{color:var(--muted);font-size:14px;margin:4px 0}
  .note{background:var(--note-bg);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px}
  .actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:12px}
  .btn{display:block;border:0;border-radius:10px;padding:12px 8px;font:inherit;font-weight:600;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}
  .btn.ghost{background:#f1f3f5;color:var(--text)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.full{width:100%;margin-top:18px;padding:14px}
  .btn:disabled{opacity:.55}
  .empty{text-align:center;color:var(--muted);padding:56px 16px}
  .center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;max-width:420px;margin:0 auto}
  .center h2{margin:8px 0}
  .center p{color:var(--muted);line-height:1.6}
  input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-weight:500;margin:16px 0 6px}
  .req{color:var(--danger)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 2px;font-size:18px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px;font:inherit;font-weight:600;color:var(--text)}
  .seg button.on.ok{border-color:var(--primary);background:var(--today-bg);color:var(--primary-dark)}
  .seg button.on.fail{border-color:var(--danger);background:var(--late-bg);color:var(--danger)}
  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#1d2330;color:#fff;padding:14px;border-radius:12px;text-align:center;z-index:30;display:none;max-width:600px;margin:0 auto}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ok-text{color:var(--primary-dark);font-weight:600}
  .fail-text{color:var(--danger);font-weight:600}
  .section-title{font-size:14px;color:var(--muted);margin:6px 2px 10px}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div><p>กำลังโหลด...</p></div></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================== ตั้งค่า (แก้ 2 บรรทัดนี้) ================== */
const LIFF_ID = '2012335287-wc7r8hpp';               // เช่น 2001234567-AbCdEfGh
const API_URL = 'https://script.google.com/macros/s/AKfycbwnqhB9HIZXEzWaUYeYUUGIUU47XVPjpnwa4aZ1soqhGLzLyqK4HAUcSFjYxIkVX_W2HQ/exec';   // จาก Apps Script > Deploy
/* ============================================================ */

const state = { idToken: null, data: null, tab: 'pending', job: null, result: 'success', busy: false };
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const soLabel = id => esc(/^so/i.test(id) ? id : 'SO ' + id);
const money = n => Number(n || 0).toLocaleString('th-TH');

function thaiDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${Number(m[3])} ${TH_MONTHS[Number(m[2]) - 1]}` : (iso || '');
}

function toast(msg, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.style.display = 'none'), ms);
}

function showLoading(msg = 'กำลังโหลด...') {
  app.innerHTML = `<div class="center"><div class="spinner"></div><p>${esc(msg)}</p></div>`;
}

function showMessage(title, msg, retry = true) {
  app.innerHTML = `<div class="center"><h2>${esc(title)}</h2><p>${esc(msg)}</p>
    ${retry ? '<button class="btn primary full" onclick="location.reload()">ลองใหม่</button>' : ''}</div>`;
}

async function api(action, data = {}) {
  // ไม่ใส่ Content-Type เพื่อให้เป็น simple request (เลี่ยงปัญหา CORS กับ Apps Script)
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, idToken: state.idToken, ...data }) });
  const json = await res.json();
  if (!json.ok) {
    if (json.error === 'TOKEN_EXPIRED') {
      if (!liff.isInClient()) { liff.logout(); location.reload(); }
      throw new Error('เซสชันหมดอายุ กรุณาปิดหน้านี้แล้วเปิดใหม่จากเมนู LINE');
    }
    if (json.error === 'NOT_REGISTERED') { showRegister(); throw Object.assign(new Error(''), { silent: true }); }
    throw new Error(json.error || 'เกิดข้อผิดพลาด');
  }
  return json;
}

/* ---------------- เริ่มต้น ---------------- */
async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    state.idToken = liff.getIDToken();
    if (!state.idToken) throw new Error('ไม่ได้รับ ID token — ตรวจว่าเปิด scope "openid" ใน LIFF แล้ว');
    const me = await api('me');
    if (!me.driver) return showRegister(me.lineName);
    if (!me.driver.active) return showMessage('บัญชีถูกระงับ', 'กรุณาติดต่อแอดมิน', false);
    await loadJobs();
  } catch (e) {
    if (!e.silent) showMessage('เกิดข้อผิดพลาด', e.message);
  }
}

/* ---------------- ลงทะเบียน ---------------- */
function showRegister(lineName = '') {
  app.innerHTML = `<div class="center">
    <h2>ลงทะเบียนคนขับ</h2>
    <p>${lineName ? 'สวัสดี ' + esc(lineName) + '<br>' : ''}กรอกเบอร์โทรที่แจ้งไว้กับแอดมิน<br>ทำครั้งเดียว ครั้งต่อไปเข้าได้ทันที</p>
    <input id="regPhone" type="tel" inputmode="numeric" placeholder="เช่น 0812345678" autocomplete="tel">
    <button class="btn primary full" id="regBtn">ลงทะเบียน</button>
  </div>`;
  $('#regBtn').onclick = async () => {
    const phone = $('#regPhone').value.trim();
    if (phone.replace(/\D/g, '').length < 9) return toast('กรุณากรอกเบอร์โทรให้ถูกต้อง');
    const btn = $('#regBtn');
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
    try {
      const me = await api('register', { phone });
      toast('ลงทะเบียนสำเร็จ ยินดีต้อนรับ ' + me.driver.name);
      await loadJobs();
    } catch (e) {
      if (!e.silent) toast(e.message, 4000);
      btn.disabled = false; btn.textContent = 'ลงทะเบียน';
    }
  };
}

/* ---------------- รายการงาน ---------------- */
async function loadJobs(silent = false) {
  if (!silent) showLoading('กำลังโหลดงาน...');
  try {
    state.data = await api('jobs');
    render();
  } catch (e) {
    if (e.silent) return;
    if (silent) toast(e.message); else showMessage('โหลดงานไม่สำเร็จ', e.message);
  }
}

function render() {
  const d = state.data;
  const list = state.tab === 'pending' ? d.pending : d.doneToday;
  app.innerHTML = `
    <header>
      <div class="top">
        <div><div class="hello">คนขับ${d.driver.plate ? ' · ' + esc(d.driver.plate) : ''}</div>
             <div class="name">${esc(d.driver.name)}</div></div>
        <button class="icon-btn" id="refreshBtn">รีเฟรช</button>
      </div>
      <div class="tabs">
        <button class="tab ${state.tab === 'pending' ? 'active' : ''}" data-tab="pending">ต้องส่ง (${d.pending.length})</button>
        <button class="tab ${state.tab === 'done' ? 'active' : ''}" data-tab="done">ปิดงานวันนี้ (${d.doneToday.length})</button>
      </div>
    </header>
    <main>${list.length ? list.map(state.tab === 'pending' ? pendingCard : doneCard).join('')
      : `<div class="empty">${state.tab === 'pending' ? 'ไม่มีงานค้าง' : 'ยังไม่มีงานที่ปิดวันนี้'}</div>`}</main>`;

  $('#refreshBtn').onclick = () => loadJobs(true).then(() => toast('อัปเดตแล้ว', 1200));
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  app.querySelectorAll('[data-close]').forEach(b => b.onclick = () => openClose(b.dataset.close));
  app.querySelectorAll('[data-map]').forEach(b => b.onclick = () => openMap(b.dataset.map));
}

function dateBadge(job) {
  if (!job.date) return '';
  const today = state.data.today;
  if (job.date === today) return '<span class="badge today">วันนี้</span>';
  if (job.date < today) return `<span class="badge late">เลยกำหนด · ${esc(thaiDate(job.date))}</span>`;
  return `<span class="badge">${esc(thaiDate(job.date))}</span>`;
}

function pendingCard(j) {
  return `<div class="card">
    <div class="row">
      <div class="badges">${dateBadge(j)}${j.slot ? `<span class="badge">${esc(j.slot)}</span>` : ''}
        ${j.cod > 0 ? `<span class="badge cod">COD ${money(j.cod)} ฿</span>` : ''}</div>
      <span class="jobid">${soLabel(j.jobId)}</span>
    </div>
    ${j.dup ? '<div class="note" style="background:var(--late-bg);color:var(--danger)">เลข SO นี้ซ้ำกันในชีต แจ้งแอดมินให้แก้ก่อนจึงจะปิดงานได้</div>' : ''}
    <div class="cust">${esc(j.customer)}</div>
    <div class="addr">${esc(j.address)}</div>
    <div class="meta">${esc(j.product)}${j.qty ? ' × ' + esc(j.qty) : ''}</div>
    ${j.note ? `<div class="note">${esc(j.note)}</div>` : ''}
    <div class="actions">
      <button class="btn ghost" data-map="${esc(j.jobId)}">นำทาง</button>
      ${j.phone ? `<a class="btn ghost" href="tel:${esc(j.phone)}">โทร</a>` : '<span class="btn ghost" style="opacity:.4">ไม่มีเบอร์</span>'}
      <button class="btn primary" data-close="${esc(j.jobId)}" ${j.dup ? 'disabled' : ''}>ปิดงาน</button>
    </div>
  </div>`;
}

function doneCard(j) {
  const ok = j.status === 'ส่งสำเร็จ';
  return `<div class="card">
    <div class="row"><span class="${ok ? 'ok-text' : 'fail-text'}">${esc(j.status)}</span>
      <span class="jobid">${esc(j.closedTime)} น. · ${soLabel(j.jobId)}</span></div>
    <div class="cust">${esc(j.customer)}</div>
    <div class="meta">${esc(j.product)}${j.qty ? ' × ' + esc(j.qty) : ''}</div>
    ${j.driverNote ? `<div class="note">${esc(j.driverNote)}</div>` : ''}
  </div>`;
}

function findJob(id) { return state.data.pending.find(j => j.jobId === id); }

function openMap(id) {
  const j = findJob(id);
  if (!j) return;
  const url = /^https?:\/\//i.test(j.map) ? j.map
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(j.address);
  liff.openWindow({ url, external: true });
}

/* ---------------- ปิดงาน ---------------- */
function openClose(id) {
  state.job = findJob(id);
  state.result = 'success';
  renderSheet();
  $('#sheetBg').classList.add('open');
}

function closeSheet() {
  if (state.busy) return;
  $('#sheetBg').classList.remove('open');
}

function renderSheet() {
  const j = state.job, ok = state.result === 'success';
  $('#sheet').innerHTML = `
    <h3>ปิดงาน ${soLabel(j.jobId)}</h3>
    <div class="meta">${esc(j.customer)} · ${esc(j.product)}</div>
    <div class="seg">
      <button class="${ok ? 'on ok' : ''}" data-r="success">ส่งสำเร็จ</button>
      <button class="${!ok ? 'on fail' : ''}" data-r="fail">ส่งไม่สำเร็จ</button>
    </div>

    ${ok && j.cod > 0 ? `
      <label>ยอดเงินที่เก็บได้ (บาท) <span class="req">*</span></label>
      <input id="codInput" type="number" inputmode="decimal" value="${j.cod}">
      <div class="meta">ยอดที่ต้องเก็บ ${money(j.cod)} บาท</div>` : ''}

    <label>${ok ? 'หมายเหตุ (ถ้ามี)' : 'เหตุผลที่ส่งไม่สำเร็จ <span class="req">*</span>'}</label>
    <textarea id="noteInput" placeholder="${ok ? 'เช่น ฝากไว้กับ รปภ.' : 'เช่น ลูกค้าไม่อยู่ โทรไม่ติด / ขอเลื่อนวัน'}">${esc(state.noteDraft || '')}</textarea>

    <button class="btn primary full" id="submitBtn">${ok ? 'ยืนยันส่งสำเร็จ' : 'บันทึกส่งไม่สำเร็จ'}</button>
    <button class="btn ghost full" style="margin-top:8px" id="cancelBtn">ยกเลิก</button>`;

  $('#sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    state.noteDraft = $('#noteInput').value;
    state.result = b.dataset.r;
    renderSheet();
  });
  $('#cancelBtn').onclick = closeSheet;
  $('#submitBtn').onclick = submitClose;
}

async function submitClose() {
  const j = state.job, ok = state.result === 'success';
  const note = $('#noteInput').value.trim();
  if (!ok && !note) return toast('กรุณาระบุเหตุผล');
  const payload = { jobId: j.jobId, result: state.result, note };
  if (ok && j.cod > 0) {
    const v = $('#codInput').value;
    if (v === '' || isNaN(Number(v))) return toast('กรุณากรอกยอดเงินที่เก็บได้');
    payload.codCollected = v;
  }

  const btn = $('#submitBtn');
  state.busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const loc = await getLocation();
    if (loc) Object.assign(payload, loc);
    await api('close', payload);
    state.busy = false;
    state.noteDraft = '';
    closeSheet();
    toast(ok ? 'ปิดงานเรียบร้อย' : 'บันทึกเรียบร้อย');
    await loadJobs(true);
  } catch (e) {
    state.busy = false;
    if (!e.silent) toast(e.message, 4000);
    btn.disabled = false; btn.textContent = ok ? 'ยืนยันส่งสำเร็จ' : 'บันทึกส่งไม่สำเร็จ';
  }
}

/* ---------------- utilities ---------------- */
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
main();
</script>
</body>
</html>
